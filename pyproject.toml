[project]
name = "save-bot"
version = "0.2.0"
description = "Telegram bot saving photos, videos and documents to Yandex Disk."
authors = [{name = "nsat1", email = "artnas379@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.31.0,<4.0",
    "aiohttp>=3.13,<4.0",
    "python-dotenv>=1.2.1,<2.0",
    "yadisk[aiohttp,async-files]>=3.4.1,<4.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10.0"
pytest-asyncio = ">=1.2,<2.0"
pytest-cov = ">=7.0,<8.0"
ruff = ">=0.13,<1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
precision = 2

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"
